[tool.poetry]
name = "coralogix-opentelemetry"
version = "0.1.3"
description = "coralogix extentions for opentelemetry"
authors = ["Nimrod Avni <nimrod@coralogix.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "coralogix_opentelemetry" }]

[tool.poetry.dependencies]
python = "^3.8"
# Floor matches metrics API + ReadableSpan.instrumentation_scope (needed by
# TransactionSpanProcessor / span_copy). Align with the locked 1.21.x line and
# the optional OTLP extra so allowed versions cannot fail at import/export.
opentelemetry-api = "^1.21.0"
opentelemetry-sdk = "^1.21.0"
# Optional: Coralogix/demo OTLP path (`pip install 'coralogix-opentelemetry[otlp]'`).
# Pin to the locked SDK line (1.21.x) so CI on Python 3.8 stays solvable.
opentelemetry-exporter-otlp-proto-grpc = { version = "1.21.0", optional = true }

[tool.poetry.extras]
otlp = ["opentelemetry-exporter-otlp-proto-grpc"]

[tool.poetry.group.dev.dependencies]
black = "^23.11.0"
mypy = "^1.7.0"
twine = "^4.0.2"
pytest = "^7.4.3"
flake8 = "5.0.4"
pytest-mock = "^3.12.0"
tomlkit = "^0.12.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
patch_version = 'scripts.patch_version:run'